[pytest]
# Bare `pytest -q` must not wander outside tests/: scratchpad/ has held whole
# working copies of the repo (a review agent's "oldrun"), whose tests/conftest.py
# collides with ours (ImportPathMismatchError), and repo/ carries model weights.
testpaths = tests
norecursedirs = scratchpad repo assets docs .git
markers =
    slow: talks to a live service (Ollama); skipped unless JARVIS_LIVE_OLLAMA=1
