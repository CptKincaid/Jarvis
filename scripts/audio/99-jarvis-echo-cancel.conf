# Jarvis echo cancellation -- PipeWire module-echo-cancel with the WebRTC
# canceller.  Installed by scripts/audio/aec-install.sh into
# ~/.config/pipewire/filter-chain.conf.d/, NOT pipewire.conf.d: the stock
# filter-chain.service user unit (`pipewire -c filter-chain.conf`) loads
# this directory, so `systemctl --user restart filter-chain` reloads the
# module WITHOUT restarting pipewire.  A pipewire restart drops the
# Bluetooth soundbar (bluez_output.F4_4E_FC_95_BA_CB.1, SoundCore 2) --
# that is what the previous design did, and why it was replaced.
#
# Topology (docs/echo-cancellation.md has the long version):
#
#   Snowball --> jarvis_aec_capture --+
#                                     |  cancel  --> jarvis_aec_source --> Jarvis
#   paplay / pacat --> jarvis_aec_sink+--> jarvis_aec_playback --> default sink
#
# The REFERENCE (what gets subtracted) is whatever is played INTO
# "jarvis_aec_sink": Jarvis's own speech (voice_settings.json
# `playback_device`) and librespot via ~/.local/bin/jarvis-spotify-device,
# which adds --device=jarvis_aec_sink when the sink exists.  The sink's
# playback stream follows the default output, so the soundbar still hears
# everything.  monitor.mode (reference = the default sink's monitor ports)
# was tried first and is unusable here: the bluez A2DP sink's monitor
# captured -180 dBFS (silence) via both parecord and pw-record on 2026-09-01
# while the mic heard the music at -19 dBFS.
#
# The capture side is pinned to the Snowball and told not to follow the
# default source, because the default source BECOMES jarvis_aec_source once
# aec-install.sh --default-source runs -- without the pin the canceller would
# capture its own output.  priority.session 100 keeps jarvis_aec_sink from
# ever becoming the default sink (the soundbar sits at 1000-ish): a default
# AEC sink would route every desktop sound through the canceller and, worse,
# the sink's own playback back into itself.
context.modules = [
    { name = libpipewire-module-echo-cancel
      args = {
          library.name = aec/libspa-aec-webrtc
          # Reference/echo alignment knobs, both UNMEASURED as of 2026-09-01
          # (no local reference existed that day; see the doc).  This box
          # links webrtc-audio-processing 0.3.1 -- the older AEC2 -- whose
          # delay estimator expects sound-card latencies, not the ~150-300 ms
          # a Bluetooth A2DP path adds.  Try in this order, re-measuring with
          # scripts/audio/aec_measure.py after each:
          #   1. aec.args webrtc.delay_agnostic = true
          #   2. buffer.play_delay = <lag>/1000  (fraction of a second; start
          #      from the `aec_measure.py lag` number)
          # audio.rate = 48000
          # buffer.play_delay = 200/1000
          aec.args = {
              # No AGC and no noise suppression: both reshape the spectrum,
              # and the ECAPA speaker gate's threshold (0.30, measured
              # 2026-08-29) was measured on the raw Snowball.
              webrtc.gain_control = false
              webrtc.extended_filter = true
              webrtc.high_pass_filter = true
              webrtc.noise_suppression = false
              # webrtc.delay_agnostic = true
          }
          capture.props = {
              node.name = "jarvis_aec_capture"
              node.description = "Jarvis AEC capture (Snowball)"
              target.object = "alsa_input.usb-BLUE_MICROPHONE_Blue_Snowball_201506-00.analog-stereo"
              node.dont-reconnect = true
              node.passive = true
          }
          source.props = {
              node.name = "jarvis_aec_source"
              node.description = "Jarvis AEC Source"
          }
          sink.props = {
              node.name = "jarvis_aec_sink"
              node.description = "Jarvis AEC Sink"
              priority.session = 100
          }
          playback.props = {
              node.name = "jarvis_aec_playback"
              node.description = "Jarvis AEC playback"
              node.passive = true
          }
      }
    }
]
