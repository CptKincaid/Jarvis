# Jarvis echo cancellation (PipeWire module-echo-cancel, WebRTC AEC).
#
# Creates "Jarvis AEC Source" (the Snowball with Jarvis's own speech
# subtracted) and "Jarvis AEC Sink" (what Jarvis plays through so the
# canceller knows what to subtract). Jarvis's mic must be the AEC source
# (it is the default source once scripts/audio/aec-install.sh runs) and its
# playback_device the AEC sink. The system default SINK is left alone --
# the AEC sink must never become the default, or its playback would
# target itself -- so only Jarvis's own speech and librespot route through
# it explicitly. The capture side is pinned to the Snowball and told not to
# follow the default source for the same reason.
context.modules = [
    { name = libpipewire-module-echo-cancel
      args = {
          library.name = aec/libspa-aec-webrtc
          aec.args = {
              webrtc.gain_control = false
              webrtc.extended_filter = true
              webrtc.high_pass_filter = true
              webrtc.noise_suppression = true
          }
          capture.props = {
              node.name = "jarvis_aec_capture"
              node.description = "Jarvis AEC capture (Snowball)"
              target.object = "alsa_input.usb-BLUE_MICROPHONE_Blue_Snowball_201506-00.analog-stereo"
              node.dont-reconnect = true
              node.passive = true
          }
          source.props = {
              node.name = "jarvis_aec_source"
              node.description = "Jarvis AEC Source"
          }
          sink.props = {
              node.name = "jarvis_aec_sink"
              node.description = "Jarvis AEC Sink"
              priority.session = 100
          }
          playback.props = {
              node.name = "jarvis_aec_playback"
              node.description = "Jarvis AEC playback"
              node.passive = true
          }
      }
    }
]
