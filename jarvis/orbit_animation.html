<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; }
  body { background: #0a0e14; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  c.width = W; c.height = H;
  cx = W/2; cy = H/2;
}
resize();
window.addEventListener('resize', resize);

// Particles
const particles = [];
for (let ring = 0; ring < 5; ring++) {
  const count = 12 + ring * 6;
  for (let i = 0; i < count; i++) {
    particles.push({
      ring, angle: (i/count)*Math.PI*2 + ring*0.3,
      baseR: 18 + ring * 18,
      speed: (0.3 + ring*0.1) * (i%2===0 ? 1 : -1),
      size: 1.5 + (i%3)*0.5,
      phase: (i*0.7) % (Math.PI*2)
    });
  }
}

// Read amplitude from shared file (polled every 100ms)
let amp = 0.25;
let recording = false;
async function pollAmp() {
  try {
    const r = await fetch('/amp?' + Date.now());
    const data = await r.json();
    amp = Math.min(data.amp || 0.25, 0.73);
    recording = data.recording || false;
  } catch(e) {}
  setTimeout(pollAmp, 80);
}
pollAmp();

let t = 0;
function draw() {
  t += 0.025;
  const idleAmp = recording ? amp : (0.25 + Math.sin(t*0.6)*0.08);
  const a = recording ? amp : idleAmp;

  // Trail
  ctx.fillStyle = `rgba(10,14,20,0.2)`;
  ctx.fillRect(0,0,W,H);

  // --- Arc Reactor Center ---
  // Outer glow
  const glowR = 45 + a*35;
  const grd = ctx.createRadialGradient(cx,cy,0,cx,cy,glowR);
  grd.addColorStop(0, `rgba(6,182,212,${0.15+a*0.25})`);
  grd.addColorStop(0.5, `rgba(6,182,212,${0.05+a*0.1})`);
  grd.addColorStop(1, 'rgba(6,182,212,0)');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(cx,cy,glowR,0,Math.PI*2); ctx.fill();

  // Concentric rings
  const ra = 0.25 + a*0.35;
  [[38,0.3],[32,0.5],[24,0.7],[16,1.0]].forEach(([r,m]) => {
    ctx.strokeStyle = `rgba(6,182,212,${ra*m})`;
    ctx.lineWidth = r===16 ? 1.5 : 1;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  });

  // Reactor segment dots on middle ring
  const segCount = 10;
  for (let i=0; i<segCount; i++) {
    const sa = (i/segCount)*Math.PI*2 + t*0.5;
    const sx = cx + Math.cos(sa)*32;
    const sy = cy + Math.sin(sa)*32;
    ctx.fillStyle = `rgba(103,232,249,${0.5+a*0.4})`;
    ctx.beginPath(); ctx.arc(sx,sy,2.5,0,Math.PI*2); ctx.fill();
  }

  // Core glow
  const coreR = 6 + a*3;
  const coreGrd = ctx.createRadialGradient(cx,cy,0,cx,cy,coreR+12);
  coreGrd.addColorStop(0, `rgba(103,232,249,${0.6+a*0.4})`);
  coreGrd.addColorStop(0.4, `rgba(6,182,212,${0.2*a})`);
  coreGrd.addColorStop(1, 'rgba(6,182,212,0)');
  ctx.fillStyle = coreGrd;
  ctx.beginPath(); ctx.arc(cx,cy,coreR+12,0,Math.PI*2); ctx.fill();

  // Solid core
  ctx.fillStyle = `rgba(150,240,255,${0.85+a*0.15})`;
  ctx.beginPath(); ctx.arc(cx,cy,coreR,0,Math.PI*2); ctx.fill();

  // --- Particles ---
  for (const p of particles) {
    const speedMult = 0.015 + a * 0.2;
    p.angle += p.speed * speedMult;

    const wobble = Math.sin(t*2.5+p.phase)*2;
    const r = p.baseR + wobble;

    // Sporadic jitter
    const jx = Math.sin(t*3.7+p.phase*2.3)*(2+a*5);
    const jy = Math.cos(t*4.1+p.phase*1.7)*(2+a*5);

    const x = cx + Math.cos(p.angle)*r + jx;
    const y = cy + Math.sin(p.angle)*r + jy;

    const alpha = 0.15 + a*0.75*(1-p.ring*0.1);
    const size = Math.max(1, p.size*(0.5+a*0.5));

    const [fr,fg,fb] = p.ring%2===0 ? [6,182,212] : [103,232,249];
    ctx.fillStyle = `rgba(${fr},${fg},${fb},${alpha})`;
    ctx.beginPath(); ctx.arc(x,y,size,0,Math.PI*2); ctx.fill();
  }

  // Voice ID ring
  if (recording) {
    ctx.strokeStyle = 'rgba(63,185,80,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx,cy,Math.min(W,H)/2-8,0,Math.PI*2); ctx.stroke();
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
